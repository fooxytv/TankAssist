name: "Release - TankAssist"

# Triggers when a release branch is merged into main.
# Creates a clean version tag (no alpha/beta suffix), a GitHub release,
# and publishes to CurseForge as a stable release.
#
# Guarded on a release/* head branch so a develop -> main merge cannot cut a
# stable release by accident. Stable ships only via release/x.y.z.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up scripts
        run: |
          chmod +x ./ci/scripts/version.sh
          chmod +x ./ci/scripts/package.sh

      - name: Determine version
        id: version
        run: |
          # Read current version from .toc and strip any pre-release suffix
          RAW_VERSION=$(awk -F': ' '/^## Version:/ {print $2}' TankAssist.toc | tr -d '\r')
          BASE_VERSION=$(echo "$RAW_VERSION" | sed 's/-.*//')

          echo "Current .toc version: $RAW_VERSION"
          echo "Base version: $BASE_VERSION"

          # Check if this base version tag already exists
          if git rev-parse "v${BASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${BASE_VERSION} already exists, bumping patch..."
            IFS='.' read -r major minor patch <<< "$BASE_VERSION"
            patch=$((patch + 1))
            BASE_VERSION="${major}.${minor}.${patch}"
          fi

          echo "Release version: $BASE_VERSION"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update .toc and commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          bash ci/scripts/version.sh stamp "$VERSION" > /dev/null

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Release ${VERSION}"
          git push origin main

      - name: Create tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          # Last stable, so the release notes span the whole gap between
          # public versions rather than stopping at an internal alpha tag.
          PREVIOUS_TAG=$(bash ci/scripts/previous_tag.sh stable "${TAG}^")

          CHANGELOG=$(bash ci/scripts/changelog.sh "$PREVIOUS_TAG" "$TAG" "## ${TAG}")
          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Package
        run: ./ci/scripts/package.sh

      - name: Find artifact
        id: artifact
        run: |
          ZIP_FILE=$(ls ci/dist/*.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip found"
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TankAssist ${{ steps.version.outputs.version }}
          body: ${{ env.CHANGELOG }}
          files: ${{ steps.artifact.outputs.zip }}
          prerelease: false

      - name: Resolve CurseForge game version
        id: game_version
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # Derived from the .toc interface and checked against CurseForge's
          # version list. The upload action does not fail on a name it cannot
          # resolve -- it uploads an empty version list and CurseForge labels
          # the file with a default -- so the check has to happen here.
          VERSION=$(bash ci/scripts/game_version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          file_path: ${{ steps.artifact.outputs.zip }}
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          game_endpoint: "wow"
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          release_type: release
          changelog: ${{ env.CHANGELOG }}
          changelog_type: "markdown"
          game_versions: ${{ steps.game_version.outputs.version }}
