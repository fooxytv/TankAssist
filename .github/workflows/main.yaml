name: "Build and Publish - TankAssist"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "CurseForge Release Type (alpha, beta, release)"
        required: false
        default: alpha
      game_versions:
        description: "Game version override, e.g. 12.1.0. Blank derives it from the .toc interface."
        required: false
        default: ""

jobs:
  publish-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up scripts
        run: |
          chmod +x ./ci/scripts/lint.sh
          chmod +x ./ci/scripts/package.sh
          chmod +x ./ci/scripts/version.sh

      # - name: Lint
      #   run: |
      #     ./ci/scripts/lint.sh

      - name: Sync version from tag to .toc files
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_VERSION#v}"

          echo "Syncing version: $VERSION"

          # Stamp every .toc via the shared script (single definition of the loop).
          bash ci/scripts/version.sh stamp "$VERSION"

      - name: Detect release type from tag
        id: detect_type
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *alpha* ]]; then
            echo "release_type=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *beta* ]]; then
            echo "release_type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag: $TAG -> Release type: $(grep release_type "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          # Alphas are incremental, so this one deliberately starts at the
          # previous tag of any kind rather than the last stable.
          PREVIOUS_TAG=$(bash ci/scripts/previous_tag.sh any HEAD^)

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: $PREVIOUS_TAG"

          mkdir -p ci/dist
          CHANGELOG=$(bash ci/scripts/changelog.sh "$PREVIOUS_TAG" "$CURRENT_TAG" "## $CURRENT_TAG")
          echo "$CHANGELOG" > ci/dist/changelog.md

          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_ENV

          echo "Generated changelog:"
          cat ci/dist/changelog.md

      - name: Package
        run: |
          ./ci/scripts/package.sh

      - name: Find artifact
        id: find_artifact
        run: |
          echo "Searching for artifact..."
          ZIP_FILE=$(ls ci/dist/*.zip | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No matching artifact found."
            exit 1
          fi

          echo "Found artifact: $ZIP_FILE"
          echo "ZIP_PATH=$ZIP_FILE" >> $GITHUB_ENV

      - name: Resolve CurseForge game version
        id: game_version
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          # Derived from the .toc interface and checked against CurseForge's
          # version list. The upload action does not fail on a name it cannot
          # resolve -- it uploads an empty version list and CurseForge labels
          # the file with a default -- so the check has to happen here.
          VERSION=$(bash ci/scripts/game_version.sh "${{ github.event.inputs.game_versions }}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          file_path: ${{ env.ZIP_PATH }}
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          game_endpoint: "wow"
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          release_type: ${{ github.event.inputs.release_type || steps.detect_type.outputs.release_type || 'release' }}
          changelog: ${{ env.CHANGELOG }}
          changelog_type: "markdown"
          # github.event.inputs only exists for workflow_dispatch; on a tag push it
          # resolves to empty, which game_version.sh treats as "derive it from the
          # .toc". Either way the value is validated before it gets here, because
          # the action itself accepts an unresolvable name without complaint.
          game_versions: ${{ steps.game_version.outputs.version }}
